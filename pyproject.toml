[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ai-core"
version = "0.1.0a0"
description = "Evidence packets for reproducible scientific RAG and AI-assisted research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeramee Oliver"}]
dependencies = []

[project.scripts]
evidence-ai-core = "evidence_ai_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
